name: APK bauen
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: App einsetzen
        run: |
          python3 parts/build.py
          mkdir -p app/src/main/assets
          cp tekkbox.html app/src/main/assets/index.html
      - name: Signatur vorbereiten
        env: { KS_B64: '${{ secrets.KS_B64 }}' }
        run: |
          test -n "$KS_B64" || { echo "Secret KS_B64 fehlt"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: APK bauen
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          VC: ${{ github.run_number }}
        run: KS_PATH="$RUNNER_TEMP/release.jks" gradle assembleRelease -Pvc=$VC --no-daemon
      - name: Veröffentlichen
        env: { GH_TOKEN: '${{ github.token }}', VC: '${{ github.run_number }}' }
        run: |
          cp app/build/outputs/apk/release/app-release.apk Tekkbox.apk
          gh release create "v$VC" Tekkbox.apk --title "Tekkbox 1.$VC" --notes "Automatisch gebaut."
