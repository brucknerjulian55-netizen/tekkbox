<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b12c4">
<title>Tekkbox</title>
<style>
:root{
  --body:#1b12c4;--deep:#120a8c;--well:#0a0558;--line:#4a40ea;--ink:#f4f2ff;--dim:#b4afee;
  --lit:#ffe600;--hot:#ff1f8f;--ice:#2df0ff;--rec:#ff2a2a;
  --font:"Roboto Condensed","sans-serif-condensed","Arial Narrow",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--body);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button,select{font:inherit;color:inherit;border:0;background:none;padding:0;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lit);outline-offset:1px}
#app{height:100dvh;display:flex;flex-direction:column;gap:6px;padding:max(7px,env(safe-area-inset-top)) max(9px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left))}
#top,#patBar{display:flex;align-items:center;gap:5px;flex:none}
#main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column;gap:6px;min-height:0}
.view.on{display:flex}
#nav{flex:none;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
#nav button{height:40px;border-radius:5px;font-weight:700;font-size:13.5px;background:var(--deep)}
#nav button.on{background:var(--ink);color:var(--body)}

.brand{font-weight:800;font-style:italic;font-size:21px;letter-spacing:-.5px;margin-right:auto;transform:skewX(-6deg)}
.key{height:40px;min-width:40px;padding:0 8px;border-radius:5px;background:var(--deep);box-shadow:inset 0 -3px 0 var(--well);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.key:active{transform:translateY(1px)}
#play.on{background:var(--lit);color:var(--well)}
#rec.on{background:var(--rec);color:#fff}
.tempo{display:flex;align-items:center;background:var(--well);border-radius:5px;height:40px}
.tempo button{width:31px;height:40px;font-size:21px;font-weight:700}
#bpm{width:40px;text-align:center;font-size:22px;font-weight:800;color:var(--lit);font-variant-numeric:tabular-nums}
#patName{flex:1;min-width:0;height:36px;border-radius:5px;background:var(--well);font-weight:700;font-size:16px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#patName.queued{animation:blink .22s steps(2) infinite}
@keyframes blink{50%{background:var(--lit);color:var(--well)}}
.mini{height:36px;min-width:36px;padding:0 7px;border-radius:5px;background:var(--deep);font-weight:700;font-size:15px;flex:none}
.mini.on{background:var(--hot);color:#fff}

/* Pads */
.stepGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:var(--well);padding:5px;border-radius:7px;flex:none}
.st{height:32px;border-radius:3px;background:var(--deep);position:relative}
.st.beat{background:color-mix(in srgb,var(--line) 55%,var(--deep))}
.st.on{background:var(--c,var(--lit))}
.st.ph{outline:2px solid var(--ink);outline-offset:-2px}
.st small{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--well)}
#pads{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:6px}
.pad{--c:var(--lit);position:relative;border-radius:9px;background:var(--deep);border:2px solid var(--line);touch-action:none;overflow:hidden;text-align:left;padding:7px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.pad b{font-size:17px;font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad i{font-style:normal;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad.sel{border-color:var(--c)}.pad.muted{opacity:.35}
.pad::before{content:"";position:absolute;inset:0;background:var(--c);opacity:var(--glow,0);pointer-events:none}
.pad>*{position:relative}.pad.note{--c:var(--ice)}.pad.note b{font-size:22px}
#mode{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:none}
.seg{height:34px;border-radius:4px;background:var(--deep);font-weight:700;font-size:15px}
.seg.on{background:var(--hot);color:#fff}
.faders{display:grid;grid-template-columns:2fr 1fr;gap:10px;flex:none}
.fader{display:grid;gap:0;font-size:13px;color:var(--dim);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:2px;background:var(--well)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:26px;margin-top:-9px;border-radius:4px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--body)}
input[type=range]::-moz-range-track{height:8px;background:var(--well)}
input[type=range]::-moz-range-thumb{width:28px;height:26px;border:0;border-radius:4px;background:var(--ink)}
.holds{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:none}
.hold{height:38px;border-radius:5px;background:var(--deep);box-shadow:inset 0 -3px 0 var(--well);font-weight:700;font-size:15px;touch-action:none}
.hold.on{background:var(--ice);color:var(--well)}

/* Channel Rack */
.chips{display:flex;gap:4px;overflow-x:auto;flex:none;scrollbar-width:none}
.chip{height:32px;padding:0 11px;border-radius:16px;background:var(--deep);font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--ice);color:var(--well)}
#rackScroll{flex:1;min-height:0;overflow:auto;background:var(--well);border-radius:7px;touch-action:pan-x pan-y}
.rRow{display:flex;align-items:stretch;height:44px;width:max-content;min-width:100%;border-bottom:1px solid var(--deep)}
.rHead{position:sticky;left:0;z-index:2;display:flex;width:128px;flex:none;background:var(--well);gap:2px;padding:4px 3px 4px 4px}
.rMute{width:20px;border-radius:3px;background:var(--c);flex:none}
.rMute.off{background:var(--deep)}
.rName{flex:1;min-width:0;text-align:left;padding:0 5px;font-weight:700;font-size:15px;border-radius:3px;background:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rName.sel{background:var(--ink);color:var(--body)}
.rOpt{width:24px;border-radius:3px;background:var(--deep);font-weight:800;flex:none}
.rCells{display:flex;gap:2px;padding:5px 5px 5px 2px}
.rc{width:27px;border-radius:3px;background:var(--deep);position:relative;flex:none;font-size:11px;font-weight:800;color:var(--well)}
.rc.beat{background:color-mix(in srgb,var(--line) 55%,var(--deep))}
.rc.barS{margin-left:7px}
.rc.on{background:var(--c)}.rc.ph{outline:2px solid var(--ink);outline-offset:-2px}
.addRow{padding:7px;position:sticky;left:0;width:max-content}

/* Piano Roll */
.prBar{display:flex;gap:4px;flex:none;align-items:center;overflow-x:auto;scrollbar-width:none}
#prCh{flex:1;min-width:0}
#ov .mini{flex:none;width:42px}
.prBar select{height:36px;border-radius:5px;background:var(--deep);font-weight:700;font-size:15px;padding:0 5px;flex:none}
.prBar select option{background:var(--deep)}
#prScroll{flex:1;min-height:0;overflow:auto;background:var(--well);border-radius:7px;position:relative}
#prInner{display:flex;width:max-content;position:relative}
#prKeys{position:sticky;left:0;z-index:3;width:42px;flex:none}
.pk{display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-size:12px;font-weight:700;background:var(--ink);color:var(--well);border-bottom:1px solid var(--dim);width:100%}
.pk.blk{background:var(--deep);color:var(--dim)}
#prCanvas{display:block;touch-action:none}
#prHead{position:absolute;top:0;bottom:0;left:42px;width:2px;background:var(--lit);pointer-events:none;z-index:2;display:none}

/* Song */
#songScroll{flex:1;min-height:0;overflow:auto;background:var(--well);border-radius:7px;padding:5px}
.sRow{display:flex;gap:2px;margin-bottom:3px;width:max-content}
.sLab{position:sticky;left:0;z-index:2;width:48px;background:var(--well);font-size:13px;font-weight:700;color:var(--dim);display:flex;align-items:center;flex:none}
.sc{width:40px;height:54px;background:var(--deep);border-radius:3px;font-size:12px;font-weight:800;flex:none;overflow:hidden;color:var(--well)}
.sc.fill{background:var(--ice)}.sc.cont{background:color-mix(in srgb,var(--ice) 65%,var(--deep))}
.sc.ph{outline:2px solid var(--ink);outline-offset:-2px}
.sBars .sc{height:24px;background:none;color:var(--dim)}
.note{font-size:14px;color:var(--dim);line-height:1.3;margin:0}

/* Mixer */
#mixList{flex:1;min-height:0;overflow:auto;display:grid;gap:4px;align-content:start}
.mx{background:var(--well);border-radius:6px;padding:6px 8px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 30px;gap:2px 8px;align-items:center}
.mxN{text-align:left;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mxF{font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mxM{height:30px;border-radius:4px;background:var(--deep);font-weight:700;font-size:13px}
.mxM.on{background:var(--rec);color:#fff}
.mx input[type=range]::-webkit-slider-runnable-track{background:var(--deep)}
.mtr{grid-column:1/-1;height:5px;background:var(--deep);border-radius:2px;overflow:hidden}
.mtr i{display:block;height:100%;width:0;background:var(--lit)}

/* Bau-Modus */
#bTabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:none}
#bSynth,#bLib{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#bSynth input[type=range]{touch-action:pan-y}
#bSynth h3{margin:5px 0 0;font-size:16px;font-style:italic;font-weight:800}
#syP{flex:1;width:100%}
.row2{display:flex;gap:4px;flex:none}.row2 .key{flex:1;font-size:14px}
.fld{flex:1;min-width:0;display:grid;font-size:13px;color:var(--dim);font-weight:600}.fld select{height:36px;border-radius:5px;background:var(--deep);color:var(--ink);font-weight:700;padding:0 4px}.fld select option,#syP option{background:var(--deep)}
.syGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.syGrid .fader b{color:var(--ink)}
#syNotes .mini{flex:1}
.libList{flex:1;min-height:0;overflow:auto;display:grid;gap:3px;align-content:start}
.lb{display:grid;grid-template-columns:46px minmax(0,1fr);gap:3px}
.lbP,.lbN{height:44px;border-radius:5px;background:var(--deep);font-weight:700;font-size:15px}.lbP{background:var(--well);color:var(--lit)}
.lbN{text-align:left;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#rackWaveBox{position:relative;flex:none;height:56px;background:var(--well);border-radius:6px;overflow:hidden}
#rackWave{display:block;width:100%;height:56px}
#rackWaveN{position:absolute;left:6px;top:3px;font-size:12px;font-weight:700;color:var(--ink);pointer-events:none;text-shadow:0 0 3px var(--well)}
/* Liveplay */
#liveTop{display:flex;gap:4px;flex:none}#liveTop .mini{flex:1}#liveEditBtn{flex:1.3!important}
#liveArea{flex:1;min-height:0;position:relative;background:var(--well);border-radius:7px;overflow:hidden}
#liveArea.edit{background-image:linear-gradient(var(--deep) 1px,transparent 1px),linear-gradient(90deg,var(--deep) 1px,transparent 1px);background-size:10% 10%}
.lc{position:absolute;border-radius:8px;background:var(--deep);border:2px solid var(--c);touch-action:none;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lc.btn.down,.lc.btn.act{background:var(--c);color:var(--well)}
.lcL{position:relative;font-weight:800;font-size:15px;text-align:center;padding:2px;overflow-wrap:anywhere;pointer-events:none;mix-blend-mode:normal;text-shadow:0 0 3px var(--well)}
.lc.btn.down .lcL,.lc.btn.act .lcL{text-shadow:none}
.lcF{position:absolute;left:0;bottom:0;background:var(--c);opacity:.65;height:100%;pointer-events:none}.lc[data-v="1"] .lcF{width:100%;height:0}
.lcR{position:absolute;right:0;bottom:0;width:26px;height:26px;background:var(--ink);border-radius:6px 0 0 0}
.edit .lc{border-style:dashed}
.lcD{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;background:var(--c);pointer-events:none}
.lcH,.lcV{position:absolute;background:var(--c);opacity:.5;pointer-events:none}.lcH{left:0;right:0;height:1px}.lcV{top:0;bottom:0;width:1px}
.lc.xy{align-items:flex-start;justify-content:flex-start}

/* Sheets */
#sheetBg{position:fixed;inset:0;background:color-mix(in srgb,var(--well) 75%,transparent);display:none;z-index:5}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90dvh;overflow:auto;background:var(--ink);color:var(--well);border-radius:12px 12px 0 0;padding:14px 15px max(16px,env(safe-area-inset-bottom));display:none;z-index:6;max-width:560px;margin:auto}
.open #sheetBg,.open #sheet{display:block}
#sheet h2{margin:0 0 3px;font-size:24px;font-weight:800;font-style:italic}
#sheet p{margin:0 0 10px;font-size:15px;line-height:1.35;overflow-wrap:anywhere;opacity:.8}
#sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
#sheet .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.act{min-height:46px;border-radius:6px;background:var(--body);color:var(--ink);font-weight:700;font-size:15px;padding:6px 8px}
.act.alt{background:color-mix(in srgb,var(--body) 14%,var(--ink));color:var(--well)}
.act.sel{background:var(--hot);color:#fff}
.act.full{grid-column:1/-1}
#sheet label{display:grid;gap:0;font-size:15px;font-weight:600;margin-bottom:5px}
#sheet select,#sheet input[type=text]{height:42px;border-radius:5px;background:color-mix(in srgb,var(--body) 14%,var(--ink));color:var(--well);padding:0 8px;font:inherit;font-weight:600;border:0;width:100%;-webkit-user-select:text;user-select:text}
#sheet input[type=range]::-webkit-slider-runnable-track{background:color-mix(in srgb,var(--body) 22%,var(--ink))}
#sheet input[type=range]::-webkit-slider-thumb{background:var(--body);box-shadow:none}
.fxRow{display:grid;grid-template-columns:44px minmax(0,1fr) 38px 38px;gap:4px;margin-bottom:5px}
.fxRow .act{min-height:42px;padding:2px}
.colorRow{display:grid;grid-template-columns:1fr 54px;align-items:center;margin-bottom:5px;font-size:15px;font-weight:600}
input[type=color]{width:54px;height:36px;border:0;padding:0;background:none}
.prev{display:flex;height:14px;border-radius:3px;overflow:hidden;margin-top:3px}.prev i{flex:1}
canvas.ed{width:100%;display:block;touch-action:none;border-radius:6px;background:var(--well);margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--lit);color:var(--well);font-weight:700;padding:9px 13px;border-radius:5px;z-index:9;display:none;max-width:90vw;text-align:center}
#hint{position:fixed;inset:0;z-index:8;background:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#hint h1{font-size:64px;margin:0;font-style:italic;font-weight:800;transform:skewX(-6deg);letter-spacing:-2px}
#hint p{font-size:17px;max-width:30ch;line-height:1.35;color:var(--dim);margin:8px 0 24px}
#hint button{background:var(--lit);color:var(--well);height:60px;padding:0 30px;border-radius:6px;font-size:21px;font-weight:800}
input[type=file]{display:none}
@media (orientation:landscape) and (max-height:520px){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 92px;grid-template-rows:auto auto minmax(0,1fr);gap:4px 6px}
  #top{grid-column:1/-1}#patBar{grid-column:1/-1}#main{grid-row:3}#nav{grid-row:3;grid-template-columns:1fr;grid-auto-rows:1fr}#nav button{height:auto}
  .key,.tempo,.tempo button{height:34px}.mini,#patName{height:30px}
  #pv.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:4px 6px}
  #pads{grid-column:2;grid-row:1/4}.st{height:20px}.stepGrid{grid-column:1}.seg{height:28px}#mode{grid-column:1}
  .faders{grid-column:1}.holds{grid-column:1;align-self:stretch}.hold{height:30px}input[type=range]{height:24px}.fader{font-size:12px}
  #pv .liveCol{grid-column:1;grid-row:3;display:flex;flex-direction:column;gap:3px;justify-content:end;min-height:0}
}
.liveCol{display:contents}
@media (prefers-reduced-motion:reduce){#patName.queued{animation:none;background:var(--lit);color:var(--well)}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand">Tekkbox</div>
    <div class="tempo" aria-label="Tempo"><button id="bpmDn" aria-label="Langsamer">−</button><div id="bpm">175</div><button id="bpmUp" aria-label="Schneller">+</button></div>
    <button class="key" id="rec" aria-label="Aufnehmen">Rec</button>
    <button class="key" id="play" aria-label="Start und Stopp">▶</button>
    <button class="key" id="menu" aria-label="Menü">≡</button>
  </div>
  <div id="patBar">
    <button class="mini" id="patPrev" aria-label="Vorheriges Pattern">‹</button>
    <button id="patName" aria-label="Pattern bearbeiten"></button>
    <button class="mini" id="patNext" aria-label="Nächstes Pattern">›</button>
    <button class="mini" id="patAdd" aria-label="Neues Pattern">+</button>
    <button class="mini" id="songMode">Song</button>
  </div>
  <div id="main">
    <div class="view on" id="pv">
      <div class="stepGrid" id="steps"></div>
      <div id="pads"></div>
      <div class="liveCol">
        <div id="mode"><button class="seg on" data-m="play">Pads</button><button class="seg" data-m="note">Noten</button><button class="seg" data-m="mute">Stumm</button></div>
        <div class="faders">
          <label class="fader"><span id="fLab">Filter</span><input id="filter" type="range" min="-100" max="100" value="0"></label>
          <label class="fader">Drive<input id="drive" type="range" min="0" max="100" value="25"></label>
        </div>
        <div class="holds"><button class="hold" data-h="r16">Roll 1/16</button><button class="hold" data-h="r32">Roll 1/32</button><button class="hold" data-h="echo">Echo</button><button class="hold" id="soundBtn">Sound</button></div>
      </div>
    </div>
    <div class="view" id="rv"><div class="chips" id="groups"></div><div id="rackWaveBox"><canvas id="rackWave" aria-label="Waveform des gewählten Kanals, tippen zum Abspielen"></canvas><span id="rackWaveN"></span></div><div id="rackScroll"></div></div>
    <div class="view" id="ov">
      <div class="prBar">
        <select id="prCh" aria-label="Kanal"></select>
        
        <button class="mini" id="prFill" style="width:auto">Muster</button><select id="prSnap" aria-label="Raster"><option value="1">1/16</option><option value="2">1/8</option><option value="4">1/4</option></select>
        <button class="mini" id="prZoomOut" aria-label="Verkleinern">−</button><button class="mini" id="prZoomIn" aria-label="Vergrößern">+</button>
      </div>
      <div id="prScroll"><div id="prHead"></div><div id="prInner"><div id="prKeys"></div><canvas id="prCanvas"></canvas></div></div>
    </div>
    <div class="view" id="sv"><p class="note">Wähle oben ein Pattern und tippe in eine Spur. Tippe nochmal, um es zu entfernen. Mit „Song“ oben spielst du das Arrangement ab.</p><div id="songScroll"></div></div>
    <div class="view" id="mv"><div id="mixList"></div></div>
    <div class="view" id="lv"><div id="liveTop"><button class="mini" id="liveEditBtn">Bearbeiten</button><button class="mini" id="liveAddB">+ Knopf</button><button class="mini" id="liveAddS">+ Slider</button><button class="mini" id="liveAddX">+ XY</button></div><div id="liveArea"></div></div>
    <div class="view" id="bv"><div id="bTabs"><button class="seg on" data-b="synth">Synth</button><button class="seg" data-b="lib">Sounds</button></div><div id="bSynth"></div><div id="bLib"></div></div>
  </div>
  <div id="nav">
    <button class="on" data-v="pv">Pads</button><button data-v="rv">Rack</button><button data-v="ov">Piano</button><button data-v="sv">Song</button><button data-v="mv">Mixer</button><button data-v="lv">Live</button><button data-v="bv">Bau</button>
  </div>
</div>
<div id="sheetBg"></div><div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<div id="hint"><h1>Tekkbox</h1><p>Deine Hardtekk-DAW. Läuft ohne Internet.</p><button id="go">Loslegen</button></div>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SCALE=[0,2,3,5,7,8,10,12],NOTE_NAMES=['A','H','C','D','E','F','G','A'],BAR=16,MAXCH=16,MAXPAT=32;
const NN=['A','A#','H','C','C#','D','D#','E','F','F#','G','G#'],noteLabel=n=>NN[((n%12)+12)%12];

function shaper(c,k){const s=c.createWaveShaper(),a=new Float32Array(2048);for(let i=0;i<2048;i++){const x=i/1024-1;a[i]=Math.tanh(x*k)/Math.tanh(k)}s.curve=a;return s}
function noiseBuf(c,d){const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}
function noise(c,d){const n=c.createBufferSource();n.buffer=noiseBuf(c,d);return n}
const R={
 Kick(c){const o=c.createOscillator(),g=c.createGain(),s=shaper(c,7);o.frequency.setValueAtTime(430,0);o.frequency.exponentialRampToValueAtTime(52,.08);g.gain.setValueAtTime(1,0);g.gain.setValueAtTime(1,.16);g.gain.exponentialRampToValueAtTime(.001,.44);o.connect(g).connect(s).connect(c.destination);o.start();
   const n=noise(c,.012),h=c.createBiquadFilter(),ng=c.createGain();h.type='highpass';h.frequency.value=3000;ng.gain.value=.5;n.connect(h).connect(ng).connect(c.destination);n.start();return .46},
 Bass(c){const f=c.createBiquadFilter(),g=c.createGain(),s=shaper(c,3);f.type='lowpass';f.Q.value=7;f.frequency.setValueAtTime(1300,0);f.frequency.exponentialRampToValueAtTime(190,.17);g.gain.setValueAtTime(.8,0);g.gain.setValueAtTime(.8,.14);g.gain.linearRampToValueAtTime(0,.21);
   [55,55.4].forEach(h=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=h;o.connect(f);o.start()});f.connect(s).connect(g).connect(c.destination);return .22},
 Clap(c){const f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.frequency.value=1500;f.Q.value=1.1;[0,.012,.024].forEach(t=>{g.gain.setValueAtTime(.95,t);g.gain.exponentialRampToValueAtTime(.12,t+.01)});g.gain.setValueAtTime(.8,.035);g.gain.exponentialRampToValueAtTime(.001,.24);const n=noise(c,.25);n.connect(f).connect(g).connect(c.destination);n.start();return .25},
 Hat(c){const f=c.createBiquadFilter(),g=c.createGain();f.type='highpass';f.frequency.value=7500;g.gain.setValueAtTime(.65,0);g.gain.exponentialRampToValueAtTime(.001,.13);const n=noise(c,.14);n.connect(f).connect(g).connect(c.destination);n.start();return .14},
 Snare(c){const o=c.createOscillator(),og=c.createGain();o.type='triangle';o.frequency.setValueAtTime(260,0);o.frequency.exponentialRampToValueAtTime(170,.05);og.gain.setValueAtTime(.7,0);og.gain.exponentialRampToValueAtTime(.001,.12);o.connect(og).connect(c.destination);o.start();
   const f=c.createBiquadFilter(),g=c.createGain();f.type='highpass';f.frequency.value=1600;g.gain.setValueAtTime(.8,0);g.gain.exponentialRampToValueAtTime(.001,.18);const n=noise(c,.2);n.connect(f).connect(g).connect(c.destination);n.start();return .2},
 Stab(c){const f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.Q.value=4;f.frequency.setValueAtTime(6500,0);f.frequency.exponentialRampToValueAtTime(700,.4);g.gain.setValueAtTime(.36,0);g.gain.exponentialRampToValueAtTime(.001,.5);
   [220,261.63,329.63,440].forEach(h=>[-7,7].forEach(d=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=h;o.detune.value=d;o.connect(f);o.start()}));f.connect(g).connect(c.destination);return .5},
 Hoover(c){const f=c.createBiquadFilter(),g=c.createGain(),s=shaper(c,2.2);f.type='lowpass';f.frequency.value=3400;g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(.42,.02);g.gain.setValueAtTime(.42,.55);g.gain.linearRampToValueAtTime(0,.75);
   [-14,0,14].forEach(d=>[220,110].forEach(h=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(h*.75,0);o.frequency.exponentialRampToValueAtTime(h,.12);o.detune.value=d;o.connect(f);o.start()}));f.connect(s).connect(g).connect(c.destination);return .76},
 Riser(c){const f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(300,0);f.frequency.exponentialRampToValueAtTime(9000,1.9);g.gain.setValueAtTime(.02,0);g.gain.exponentialRampToValueAtTime(.8,1.85);g.gain.linearRampToValueAtTime(0,2);const n=noise(c,2);n.connect(f).connect(g).connect(c.destination);n.start();return 2}
};

const G=(name,cat,o)=>({name,cat,patch:{...PD,...o}});

 G('Kurze Kick','Kicks',{w1:'sine',freq:62,penv:34,pt:.04,d:.12,len:.17,drive:45,click:.6}),
 G('Offbeat-Bass','Bass',{w1:'saw',mix2:.7,w2:'saw',uni:2,spread:8,freq:55,d:.17,s:.5,r:.04,len:.22,cut:180,res:7,fe:3,fd:.15,drive:30}),
 G('Reese-Bass','Bass',{w1:'saw',w2:'saw',mix2:.8,semi2:0,uni:5,spread:22,freq:55,d:.4,s:.9,r:.06,len:.5,cut:700,res:3,drive:35}),
 G('Square-Bass','Bass',{w1:'square',freq:55,d:.2,s:.4,len:.26,cut:500,res:4,fe:2,fd:.1,drive:20}),

 G('Offbeat Hat','Hats',{lvl:0,n:1,nd:.11,nhp:7500,len:.15}),

 G('Tight Snare','Snares',{w1:'tri',freq:190,penv:12,pt:.03,d:.1,len:.2,n:.9,nd:.13,nhp:1700}),
 G('Rave Snare','Snares',{w1:'tri',freq:230,penv:16,pt:.03,d:.14,len:.3,n:1,nd:.22,nhp:1100,drive:40}),
 G('Noise Snare','Snares',{lvl:0,n:1,nd:.18,nhp:1400,len:.24,drive:25}),

 G('Dur Stab','Stabs',{w1:'saw',uni:3,spread:12,chord:'dur',freq:220,d:.35,len:.45,cut:1100,res:3,fe:2.5,fd:.25}),
 G('Hoover Stab','Stabs',{w1:'saw',w2:'saw',mix2:.8,semi2:-12,uni:5,spread:20,freq:220,penv:-5,pt:.12,a:.01,d:.5,s:.5,r:.1,len:.7,cut:3400,drive:30}),
 G('Quinten Stab','Stabs',{w1:'square',mix2:.6,w2:'saw',chord:'quinte',freq:220,d:.3,len:.4,cut:1600,res:2,fe:2,fd:.2}),
 G('Orgel Stab','Stabs',{w1:'square',mix2:.5,w2:'sine',semi2:12,chord:'moll7',freq:220,d:.25,s:.3,len:.35,cut:2600}),
 G('Pluck Melodie','Melodien',{w1:'saw',w2:'square',mix2:.5,uni:3,spread:9,freq:220,d:.22,len:.3,cut:900,res:3,fe:3.5,fd:.14}),
 G('Tekk Lead','Melodien',{w1:'saw',w2:'saw',mix2:.8,semi2:7,uni:5,spread:14,freq:220,a:.003,d:.3,s:.75,r:.08,len:.6,cut:5000,res:1.5,drive:30}),

const SYN=[['Oszillatoren',[['lvl','Lautstärke Osz. 1',0,1,.01],['mix2','Lautstärke Osz. 2',0,1,.01],['semi2','Osz. 2 Halbtöne',-24,24,1],['uni','Stimmen',1,7,1],['spread','Verstimmung',0,50,1]]],
 ['Tonhöhe',[['freq','Grundton (Hz)',30,880,1],['penv','Pitch-Hüllkurve',-48,60,1],['pt','Pitch-Zeit',.005,.4,.005]]],
 ['Lautstärke',[['a','Attack',.001,1,.001],['d','Decay',.01,2,.01],['s','Sustain',0,1,.01],['r','Release',.01,1,.01],['len','Länge (s)',.05,4,.01]]],
 ['Filter',[['cut','Frequenz (Hz)',40,18000,10],['res','Resonanz',.3,16,.1],['fe','Filter-Hüllkurve',0,6,.1],['fd','Filter-Zeit',.01,1,.01]]],
 ['Rauschen und Biss',[['n','Rauschen',0,1,.01],['nd','Rausch-Länge',.01,1,.01],['nhp','Rausch-Hochpass',100,12000,50],['click','Klick',0,1,.01],['drive','Verzerrung',0,100,1]]]];
async function renderPatch(P,semi=0){
  const sr=44100,len=Math.max(.05,P.len),c=new OfflineAudioContext(2,Math.ceil(sr*len),sr),amp=c.createGain(),f=c.createBiquadFilter(),sum=c.createGain(),end=c.createGain();
  sum.connect(f);f.connect(amp);f.type=P.ft;f.Q.value=P.res;
  const cu=Math.min(18000,P.cut*Math.pow(2,P.fe));f.frequency.setValueAtTime(cu,0);if(P.fe>0)f.frequency.exponentialRampToValueAtTime(P.cut,Math.min(len,P.fd));
  const relT=Math.max(0,len-P.r),aEnd=Math.min(P.a,relT),dEnd=Math.min(aEnd+P.d,relT);
  amp.gain.setValueAtTime(0,0);amp.gain.linearRampToValueAtTime(1,aEnd);
  amp.gain.exponentialRampToValueAtTime(Math.max(.001,P.s),dEnd);amp.gain.setValueAtTime(Math.max(.001,P.s),relT);amp.gain.linearRampToValueAtTime(0,len);
  const base=P.freq*Math.pow(2,semi/12),U=Math.max(1,P.uni|0);
  const osc=(wave,fr,level)=>{for(let u=0;u<U;u++){const o=c.createOscillator(),g=c.createGain(),p=c.createStereoPanner(),x=U>1?u/(U-1)*2-1:0;o.type=WAVES[wave];o.detune.value=x*P.spread;p.pan.value=x*.6;g.gain.value=level/Math.sqrt(U);
    o.frequency.setValueAtTime(Math.max(1,fr*Math.pow(2,P.penv/12)),0);if(P.penv)o.frequency.exponentialRampToValueAtTime(Math.max(1,fr),P.pt);o.connect(g).connect(p).connect(sum);o.start()}};
  (CHORDS[P.chord]||[0]).forEach(iv=>{const fr=base*Math.pow(2,iv/12);if(P.lvl>0)osc(P.w1,fr,P.lvl);if(P.mix2>0)osc(P.w2,fr*Math.pow(2,P.semi2/12),P.mix2)});
  amp.connect(end);
  const nz=(lvl,dec,hpf)=>{const n=c.createBufferSource(),h=c.createBiquadFilter(),g=c.createGain();n.buffer=noiseBuf(c,Math.min(len,dec+.02));h.type='highpass';h.frequency.value=hpf;g.gain.setValueAtTime(lvl,0);g.gain.exponentialRampToValueAtTime(.001,Math.min(len,dec));n.connect(h).connect(g).connect(end);n.start()};
  if(P.n>0)nz(P.n,P.nd,P.nhp);if(P.click>0)nz(P.click*.8,.012,2500);
  const s=shaper(c,1+P.drive/9);s.oversample='2x';if(P.drive>0){end.connect(s).connect(c.destination)}else end.connect(c.destination);
  const b=await c.startRendering();let pk=0;for(let k=0;k<2;k++)for(const x of b.getChannelData(k))pk=Math.max(pk,Math.abs(x));
  const lv=.92/(pk||1);for(let k=0;k<2;k++){const a=b.getChannelData(k);for(let j=0;j<a.length;j++)a[j]*=lv}return b;
}
function toWav(b){
  const ch=b.numberOfChannels,n=b.length,sr=b.sampleRate,o=new ArrayBuffer(44+n*ch*2),v=new DataView(o),w=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*ch*2,true);
  const d=[...Array(ch)].map((_,i)=>b.getChannelData(i));let p=44;for(let i=0;i<n;i++)for(let k=0;k<ch;k++){v.setInt16(p,Math.max(-1,Math.min(1,d[k][i]))*32767,true);p+=2}return o;
}
/* Bibliothek: gilt für alle Projekte */
let LIB={folders:['Meine Sounds'],items:[],next:1},SP={...GALLERY[0].patch},spName=GALLERY[0].name,spBuf=null,bTab='synth',folder='Kicks',previewSrc=null,galCache={};
const CATS=[...new Set(GALLERY.map(g=>g.cat))];
const saveLib=()=>idbSet('lib',JSON.stringify(LIB));
function previewBuf(b){if(!ctx)return;try{previewSrc&&previewSrc.stop()}catch(e){}const s=ctx.createBufferSource();s.buffer=b;s.connect(slotN[0].in);s.start();previewSrc=s}
async function assignBuf(t,buf,name){buffers[t.id]=buf;t.sample=name;await idbSet('s'+t.id,toWav(buf));drawAll();save()}
async function newChannel(buf,name,cat){if(S.tracks.length>=MAXCH){toast('Mehr als '+MAXCH+' Kanäle gehen nicht.');return null}const d=DEF[0],t=mkTrack(S.nextId++,[name.slice(0,20),['#ffe600','#ff1f8f','#2df0ff','#b6ff3c','#ff8a1f'][S.tracks.length%5],5,null]);t.group=S.groups.includes(cat)?cat:null;S.tracks.push(t);wireTrack(t);await assignBuf(t,buf,name);sel=t.id;return t}
function drawBuild(){
  if(view!=='bv')return;$$('#bTabs .seg').forEach(b=>b.classList.toggle('on',b.dataset.b===bTab));$('#bSynth').style.display=bTab==='synth'?'':'none';$('#bLib').style.display=bTab==='lib'?'':'none';
  if(bTab==='synth')drawSynth();else drawLib();
}
function drawSynth(){
  const b=$('#bSynth');if(b.dataset.ok){syncSynth();return}b.dataset.ok=1;
  b.innerHTML=`<div class="prBar"><select id="syP" aria-label="Vorlage">${GALLERY.map((g,i)=>`<option value="${i}">${g.cat}: ${g.name}</option>`).join('')}</select></div>
  <canvas class="ed" id="syW" height="90"></canvas><div class="prBar" id="syNotes">${NOTE_NAMES.map((n,i)=>`<button class="mini" data-n="${SCALE[i]}">${n}</button>`).join('')}</div>
  <div class="row2"><button class="key" id="syPlay">Anhören</button><button class="key" id="syCh">Auf Kanal</button><button class="key" id="sySave">Speichern</button></div>
  <div class="row2 sel2"><label class="fld">Oszillator 1<select id="syW1">${Object.keys(WAVES).map(w=>`<option value="${w}">${WN[w]}</option>`).join('')}</select></label><label class="fld">Oszillator 2<select id="syW2">${Object.keys(WAVES).map(w=>`<option value="${w}">${WN[w]}</option>`).join('')}</select></label><label class="fld">Akkord<select id="syC">${Object.keys(CHORDS).map(w=>`<option value="${w}">${CN[w]}</option>`).join('')}</select></label></div>
  ${SYN.map(([h,r])=>`<h3>${h}</h3><div class="syGrid">${r.map(s=>`<label class="fader"><span>${s[1]}: <b id="sv_${s[0]}"></b></span><input data-s="${s[0]}" type="range" min="${s[2]}" max="${s[3]}" step="${s[4]}"></label>`).join('')}</div>`).join('')}`;
  let t;const go=()=>{clearTimeout(t);t=setTimeout(()=>synthPlay(0),180)};
  $$('#bSynth [data-s]').forEach(e=>e.oninput=()=>{SP[e.dataset.s]=+e.value;$('#sv_'+e.dataset.s).textContent=e.value;spName='Eigener Sound';go()});
  $('#syW1').onchange=e=>{SP.w1=e.target.value;go()};$('#syW2').onchange=e=>{SP.w2=e.target.value;go()};$('#syC').onchange=e=>{SP.chord=e.target.value;go()};
  $('#syP').onchange=e=>{const g=GALLERY[+e.target.value];SP={...g.patch};spName=g.name;syncSynth();synthPlay(0)};
  $('#syPlay').onclick=()=>synthPlay(0);$$('#syNotes [data-n]').forEach(e=>e.onclick=()=>synthPlay(+e.dataset.n));
  $('#syCh').onclick=async()=>{await resume();const bf=await renderPatch(SP),t=tr(sel);if(t){await assignBuf(t,bf,spName);toast(spName+' liegt auf Kanal '+t.name)}};
  $('#sySave').onclick=saveSheet;syncSynth();resume().then(()=>renderPatch(SP)).then(x=>{spBuf=x;drawWave()});
}
function syncSynth(){$$('#bSynth [data-s]').forEach(e=>{e.value=SP[e.dataset.s];$('#sv_'+e.dataset.s).textContent=SP[e.dataset.s]});$('#syW1').value=SP.w1;$('#syW2').value=SP.w2;$('#syC').value=SP.chord;drawWave()}
function drawWave(){const c=$('#syW');if(!c||!c.clientWidth)return;const{g,w,h}=sizeCanvas(c,90),C=prCol();g.clearRect(0,0,w,h);if(!spBuf)return;const a=spBuf.getChannelData(0),st=Math.max(1,a.length/w|0);g.fillStyle=C('--lit');for(let x=0;x<w;x++){let m=0;for(let i=x*st;i<(x+1)*st&&i<a.length;i+=4)m=Math.max(m,Math.abs(a[i]));g.fillRect(x,h/2-m*h/2,1,Math.max(1,m*h))}}
async function synthPlay(semi){await resume();spBuf=await renderPatch(SP,semi);drawWave();previewBuf(spBuf)}
function saveSheet(){
  openSheet(`<h2>Sound speichern</h2><p>Der Sound landet in deiner Bibliothek und steht in jedem Projekt bereit.</p><label>Name<input id="lN" type="text" maxlength="24" value="${esc(spName)}"></label><label>Ordner<select id="lF">${LIB.folders.map(f=>`<option>${esc(f)}</option>`).join('')}</select></label><div class="row"><button class="act" id="lS">Speichern</button><button class="act alt" id="sC">Abbrechen</button></div>`);
  $('#sC').onclick=closeSheet;
  $('#lS').onclick=async()=>{await resume();const b=await renderPatch(SP),id=LIB.next++,name=$('#lN').value.trim()||'Sound '+id,f=$('#lF').value;await idbSet('L'+id,toWav(b));LIB.items.push({id,name,folder:f,patch:{...SP}});await saveLib();folder=f;closeSheet();toast(name+' gespeichert');if(view==='bv')drawBuild()};
}
const libItems=()=>CATS.includes(folder)?GALLERY.filter(g=>g.cat===folder).map((g,i)=>({gal:GALLERY.indexOf(g),name:g.name,patch:g.patch})):LIB.items.filter(i=>i.folder===folder);
async function itemBuf(it){await resume();if(it.gal!=null){if(!galCache[it.gal])galCache[it.gal]=await renderPatch(it.patch);return galCache[it.gal]}const ab=await idbGet('L'+it.id);return ctx.decodeAudioData(ab.slice(0))}

  try{const ab=await file.arrayBuffer(),buf=await ctx.decodeAudioData(ab.slice(0)),t=tr(loadTrack);buffers[t.id]=buf;t.sample=file.name.replace(/\.[^.]+$/,'');await idbSet('s'+t.id,ab);drawAll();save();sel=t.id;trigger(t,ctx.currentTime,0);channelSheet();toast('Sample geladen')}
  catch(e){toast('Diese Datei lässt sich nicht lesen. Probiere WAV oder MP3.')}}

/* ---------- Verdrahtung ---------- */
function setView(v){view=v;$$('.view').forEach(e=>e.classList.toggle('on',e.id===v));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='rv')drawRack();if(v==='ov'){prSelect();drawPiano();prFocus()}if(v==='sv')drawSong();if(v==='mv')drawMixer();if(v==='bv')drawBuild();if(v==='lv')drawLive();drawPlayhead()}
function holdBtn(e,on,off){e.addEventListener('pointerdown',async ev=>{ev.preventDefault();e.setPointerCapture&&e.setPointerCapture(ev.pointerId);await resume();e.classList.add('on');on()});['pointerup','pointercancel','lostpointercapture'].forEach(n=>e.addEventListener(n,()=>{e.classList.remove('on');off()}))}
function bpmBtn(e,d){let h;const set=()=>{S.bpm=Math.min(260,Math.max(100,S.bpm+d));$('#bpm').textContent=S.bpm;if(ctx){echoDl.delayTime.value=stepDur()*LE.st;slotN.forEach(s=>s.fxn.forEach(f=>f.n&&f.n.set()));allTF()}save()};
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();set();h=setTimeout(()=>h=setInterval(set,70),350)});['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,()=>{clearTimeout(h);clearInterval(h)}))}
$('#liveEditBtn').onclick=()=>{liveEdit=!liveEdit;drawLive()};$('#liveAddB').onclick=()=>addLive('btn');$('#liveAddS').onclick=()=>addLive('slider');$('#liveAddX').onclick=()=>addLive('xy');
$('#prFill').onclick=fillSheet;
$('#rackWave').onclick=async()=>{await resume();const t=tr(sel);if(t)trigger(t,ctx.currentTime,0)};
$('#go').onclick=async()=>{$('#hint').style.display='none';await resume()};
$('#play').onclick=togglePlay;$('#rec').onclick=()=>{recOn=!recOn;$('#rec').classList.toggle('on',recOn)};
$('#menu').onclick=menuSheet;$('#sheetBg').onclick=closeSheet;$('#soundBtn').onclick=channelSheet;
$('#patPrev').onclick=()=>goPat((queued??S.cur)-1);$('#patNext').onclick=()=>goPat((queued??S.cur)+1);$('#patName').onclick=patSheet;
$('#patAdd').onclick=()=>{if(S.patterns.length>=MAXPAT)return toast('Mehr als '+MAXPAT+' Pattern gehen nicht.');S.patterns.push(newPat('Pattern '+(S.patterns.length+1)));goPat(S.patterns.length-1)};
$('#songMode').onclick=()=>{S.songMode=!S.songMode;queued=null;pos=0;drawPatBar();save()};
$$('.seg').forEach(b=>b.onclick=()=>setMode(b.dataset.m));$$('#nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
bpmBtn($('#bpmDn'),-1);bpmBtn($('#bpmUp'),1);
const fil=$('#filter');fil.oninput=()=>setFilter(+fil.value);['pointerup','pointercancel','touchend'].forEach(n=>fil.addEventListener(n,()=>{fil.value=0;setFilter(0)}));$('#drive').oninput=setDrive;
$$('.hold[data-h]').forEach(e=>{const h=e.dataset.h;holdBtn(e,()=>{if(h==='echo')echoIn.gain.setTargetAtTime(.8,ctx.currentTime,.01);else roll=h==='r16'?16:32},()=>{if(h==='echo'){if(ctx)echoIn.gain.setTargetAtTime(0,ctx.currentTime,.02)}else roll=0})});
$('#packFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importPack(f)};
$('#libFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importAudio(f)};
$$('#bTabs .seg').forEach(b=>b.onclick=()=>{bTab=b.dataset.b;drawBuild()});
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)loadSample(f)};
$('#projFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importProject(f)};
window.addEventListener('pagehide',()=>{if(db)idbSet('state',JSON.stringify(S))});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&db)idbSet('state',JSON.stringify(S))});
wirePiano();
(async()=>{
  try{const j=localStorage.getItem('tekk-theme');if(j)TH=JSON.parse(j)}catch(e){}
  await openDb();
  try{const j=await idbGet('theme');if(j)TH=JSON.parse(j);const l=await idbGet('lib');if(l)LIB=JSON.parse(l);const s=await idbGet('state');if(s){const d=JSON.parse(s);if(d.patterns&&d.patterns.length)S=migrate(d)}}catch(e){}
  applyTheme();applyState();requestAnimationFrame(frame);checkUpdate(true)
})();
window.TEKK={get S(){return S},get ctx(){return ctx},get buffers(){return buffers},get builtin(){return builtin},get slotN(){return slotN},get workletOK(){return workletOK},get TH(){return TH},get sel(){return sel},get LIB(){return LIB},GALLERY,renderPatch};
